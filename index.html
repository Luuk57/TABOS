<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TabOS - Smart Home Edition</title>
  
  <!-- PWA Metadata -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22TabOS%22,%22short_name%22:%22TabOS%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f172a%22,%22theme_color%22:%22%230f172a%22}">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --taskbar-bg: rgba(15, 23, 42, 0.85);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --danger-color: #ef4444;
      --success-color: #22c55e;
      --window-header-bg: rgba(30, 41, 59, 0.95);
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-family);
      background: #090d16;
      color: var(--text-color);
    }

    /* Desktop Area */
    #desktop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 54px;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      overflow: hidden;
    }

    /* Desktop App Grid */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 20px;
      padding: 24px;
      max-width: 700px;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
    }

    .desktop-icon:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.1);
    }

    .desktop-icon .icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .desktop-icon .label {
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      color: var(--text-color);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Window Styles */
    .window {
      position: absolute;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 320px;
      min-height: 240px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .window.minimized {
      opacity: 0;
      transform: scale(0.8) translateY(100px);
      pointer-events: none;
    }

    .window.maximized {
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: calc(100% - 54px) !important;
      border-radius: 0;
    }

    .window-header {
      height: 44px;
      background: var(--window-header-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--card-border);
      cursor: move;
      touch-action: none;
    }

    .window-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .win-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .win-btn.close:active {
      background: var(--danger-color);
    }

    .window-body {
      flex: 1;
      overflow: auto;
      padding: 16px;
      position: relative;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Taskbar */
    #taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: var(--taskbar-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 99999;
    }

    .taskbar-left, .taskbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .taskbar-center {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }

    .start-btn {
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .taskbar-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .taskbar-item.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent-color);
    }

    .sys-tray {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
    }

    /* Start Menu */
    #start-menu {
      position: absolute;
      bottom: 64px;
      left: 12px;
      width: 320px;
      background: rgba(30, 41, 59, 0.98);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
      z-index: 100000;
    }

    #start-menu.open {
      display: block;
    }

    .start-menu-header {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .start-menu-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .start-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .start-item:hover, .start-item:active {
      background: rgba(255, 255, 255, 0.08);
    }

    /* ===================================================
       SMART HOME STYLES (Tegels & Kamers)
       =================================================== */
    .smarthome-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100%;
    }

    .room-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .room-tab {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .room-tab.active {
      background: var(--accent-color);
      color: #0f172a;
      border-color: var(--accent-color);
    }

    .tiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .device-tile {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 110px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .device-tile.on {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-color);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .device-tile .tile-icon {
      font-size: 24px;
    }

    .device-tile .tile-info .tile-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .device-tile .tile-info .tile-state {
      font-size: 11px;
      color: var(--text-muted);
    }

    .device-tile.on .tile-state {
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <!-- Desktop -->
  <div id="desktop">
    <div class="app-grid" id="desktop-grid"></div>
  </div>

  <!-- Start Menu -->
  <div id="start-menu">
    <div class="start-menu-header">Applicaties</div>
    <div class="start-menu-list" id="start-list"></div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div class="taskbar-left">
      <button class="start-btn" id="start-btn">
        <span>⚡</span> TabOS
      </button>
    </div>

    <div class="taskbar-center" id="taskbar-apps"></div>

    <div class="taskbar-right">
      <div class="sys-tray">
        <span id="sys-wifi" title="Netwerk status">🌐</span>
        <span id="sys-battery" title="Accu status">🔋 100%</span>
        <span id="sys-clock">00:00</span>
        <span id="sys-fullscreen" style="cursor:pointer;" title="Volledig scherm">⛶</span>
      </div>
    </div>
  </div>

  <script>
    /* ===================================================
       TABOS CORE ENGINE
       =================================================== */
    const TabOS = {
      apps: {},
      windows: {},
      activeZIndex: 100,

      registerApp(id, config) {
        this.apps[id] = config;
        this.renderDesktopIcons();
        this.renderStartMenuItems();
      },

      openApp(id) {
        if (this.windows[id]) {
          this.focusWindow(id);
          this.windows[id].element.classList.remove('minimized');
          return;
        }

        const app = this.apps[id];
        if (!app) return;

        const winEl = document.createElement('div');
        winEl.className = 'window';
        winEl.style.width = app.width || '520px';
        winEl.style.height = app.height || '420px';
        
        const top = Math.max(20, (window.innerHeight - 54 - parseInt(winEl.style.height)) / 2);
        const left = Math.max(20, (window.innerWidth - parseInt(winEl.style.width)) / 2);
        winEl.style.top = top + 'px';
        winEl.style.left = left + 'px';

        winEl.innerHTML = `
          <div class="window-header">
            <div class="window-title">
              <span>${app.icon}</span>
              <span>${app.title}</span>
            </div>
            <div class="window-controls">
              <button class="win-btn min">—</button>
              <button class="win-btn max">□</button>
              <button class="win-btn close">✕</button>
            </div>
          </div>
          <div class="window-body"></div>
        `;

        document.getElementById('desktop').appendChild(winEl);

        const winData = { id: id, element: winEl, isMaximized: false };
        this.windows[id] = winData;

        const bodyEl = winEl.querySelector('.window-body');
        if (typeof app.render === 'function') {
          app.render(bodyEl);
        }

        this.setupWindowEvents(winData);
        this.focusWindow(id);
        this.updateTaskbar();
        document.getElementById('start-menu').classList.remove('open');
      },

      focusWindow(id) {
        const win = this.windows[id];
        if (!win) return;
        this.activeZIndex++;
        win.element.style.zIndex = this.activeZIndex;
        this.updateTaskbar();
      },

      closeWindow(id) {
        const win = this.windows[id];
        if (!win) return;
        win.element.remove();
        delete this.windows[id];
        this.updateTaskbar();
      },

      toggleMinimize(id) {
        const win = this.windows[id];
        if (!win) return;
        win.element.classList.toggle('minimized');
      },

      toggleMaximize(id) {
        const win = this.windows[id];
        if (!win) return;
        win.isMaximized = !win.isMaximized;
        win.element.classList.toggle('maximized', win.isMaximized);
      },

      setupWindowEvents(winData) {
        const el = winData.element;
        const header = el.querySelector('.window-header');

        el.addEventListener('pointerdown', () => this.focusWindow(winData.id));

        header.querySelector('.min').onclick = (e) => { e.stopPropagation(); this.toggleMinimize(winData.id); };
        header.querySelector('.max').onclick = (e) => { e.stopPropagation(); this.toggleMaximize(winData.id); };
        header.querySelector('.close').onclick = (e) => { e.stopPropagation(); this.closeWindow(winData.id); };

        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        const onPointerDown = (e) => {
          if (winData.isMaximized) return;
          isDragging = true;
          startX = e.clientX || e.touches?.[0].clientX;
          startY = e.clientY || e.touches?.[0].clientY;
          initialLeft = el.offsetLeft;
          initialTop = el.offsetTop;
          
          document.addEventListener('pointermove', onPointerMove);
          document.addEventListener('pointerup', onPointerUp);
        };

        const onPointerMove = (e) => {
          if (!isDragging) return;
          const currentX = e.clientX || e.touches?.[0].clientX;
          const currentY = e.clientY || e.touches?.[0].clientY;
          el.style.left = (initialLeft + (currentX - startX)) + 'px';
          el.style.top = (initialTop + (currentY - startY)) + 'px';
        };

        const onPointerUp = () => {
          isDragging = false;
          document.removeEventListener('pointermove', onPointerMove);
          document.removeEventListener('pointerup', onPointerUp);
        };

        header.addEventListener('pointerdown', onPointerDown);
      },

      renderDesktopIcons() {
        const grid = document.getElementById('desktop-grid');
        grid.innerHTML = '';
        Object.keys(this.apps).forEach(id => {
          const app = this.apps[id];
          const iconEl = document.createElement('div');
          iconEl.className = 'desktop-icon';
          iconEl.innerHTML = `<div class="icon">${app.icon}</div><div class="label">${app.title}</div>`;
          iconEl.onclick = () => this.openApp(id);
          grid.appendChild(iconEl);
        });
      },

      renderStartMenuItems() {
        const list = document.getElementById('start-list');
        list.innerHTML = '';
        Object.keys(this.apps).forEach(id => {
          const app = this.apps[id];
          const itemEl = document.createElement('div');
          itemEl.className = 'start-item';
          itemEl.innerHTML = `<span style="font-size: 20px;">${app.icon}</span><span>${app.title}</span>`;
          itemEl.onclick = () => this.openApp(id);
          list.appendChild(itemEl);
        });
      },

      updateTaskbar() {
        const container = document.getElementById('taskbar-apps');
        container.innerHTML = '';
        Object.keys(this.windows).forEach(id => {
          const win = this.windows[id];
          const app = this.apps[id];
          const item = document.createElement('div');
          item.className = 'taskbar-item' + (parseInt(win.element.style.zIndex) === this.activeZIndex ? ' active' : '');
          item.innerHTML = `<span>${app.icon}</span><span>${app.title}</span>`;
          item.onclick = () => {
            if (win.element.classList.contains('minimized')) {
              win.element.classList.remove('minimized');
              this.focusWindow(id);
            } else if (parseInt(win.element.style.zIndex) === this.activeZIndex) {
              this.toggleMinimize(id);
            } else {
              this.focusWindow(id);
            }
          };
          container.appendChild(item);
        });
      }
    };

    /* ===================================================
       SYSTEEMSTATUS & UTILITIES
       =================================================== */
    function updateClock() {
      const d = new Date();
      document.getElementById('sys-clock').innerText = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    if ('getBattery' in navigator) {
      navigator.getBattery().then(battery => {
        const updateBat = () => {
          const level = Math.round(battery.level * 100);
          document.getElementById('sys-battery').innerText = `${battery.charging ? '⚡' : '🔋'} ${level}%`;
        };
        updateBat();
        battery.addEventListener('levelchange', updateBat);
        battery.addEventListener('chargingchange', updateBat);
      });
    }

    function updateOnlineStatus() {
      document.getElementById('sys-wifi').innerText = navigator.onLine ? '🌐' : '📡❌';
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    document.getElementById('start-btn').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('start-menu').classList.toggle('open');
    };
    document.addEventListener('click', () => {
      document.getElementById('start-menu').classList.remove('open');
    });

    document.getElementById('sys-fullscreen').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    /* ===================================================
       APP 1: SMARTHOME KAMER BEDIENING (Tegels)
       =================================================== */
    TabOS.registerApp('smarthome', {
      title: 'Smart Home',
      icon: '🏠',
      width: '650px',
      height: '480px',
      render: function(container) {
        // Mock data van je kamers en apparaten
        const rooms = {
          "1 Woning": [
            { id: 'l1', name: 'Hal lamp', type: 'light', icon: '💡', on: false },
            { id: 'l2', name: 'Eetkamer 1', type: 'light', icon: '💡', on: true },
            { id: 'l3', name: 'Woonkamer TV', type: 'tv', icon: '📺', on: false },
            { id: 'ac1', name: 'Portable AC', type: 'ac', icon: '❄️', on: false, temp: '21°C' },
            { id: 'th1', name: 'Thermostaat', type: 'thermostat', icon: '🌡️', on: true, temp: '20.5°C' },
            { id: 'sp1', name: 'Speaker Kamer', type: 'speaker', icon: '🔊', on: false }
          ],
          "Keuken": [
            { id: 'l4', name: 'Keuken lamp', type: 'light', icon: '💡', on: true },
            { id: 'sp2', name: 'Keuken Speaker', type: 'speaker', icon: '🔊', on: false }
          ],
          "Buiten": [
            { id: 'l5', name: 'Terras', type: 'light', icon: '💡', on: false },
            { id: 'l6', name: 'Voordeur lamp', type: 'light', icon: '💡', on: false },
            { id: 'l7', name: 'Garage lamp', type: 'light', icon: '💡', on: false }
          ]
        };

        let currentRoom = Object.keys(rooms)[0];

        function renderContent() {
          container.innerHTML = `
            <div class="smarthome-container">
              <div class="room-tabs" id="room-tabs-container"></div>
              <div class="tiles-grid" id="tiles-grid-container"></div>
            </div>
          `;

          // Render kamer tabbladen
          const tabsContainer = container.querySelector('#room-tabs-container');
          Object.keys(rooms).forEach(roomName => {
            const tab = document.createElement('div');
            tab.className = 'room-tab' + (roomName === currentRoom ? ' active' : '');
            tab.innerText = roomName;
            tab.onclick = () => {
              currentRoom = roomName;
              renderContent();
            };
            tabsContainer.appendChild(tab);
          });

          // Render tegels voor geselecteerde kamer
          const gridContainer = container.querySelector('#tiles-grid-container');
          rooms[currentRoom].forEach(device => {
            const tile = document.createElement('div');
            tile.className = 'device-tile' + (device.on ? ' on' : '');
            
            let stateText = device.on ? 'Aan' : 'Uit';
            if (device.temp) stateText = device.temp;

            tile.innerHTML = `
              <div class="tile-icon">${device.icon}</div>
              <div class="tile-info">
                <div class="tile-name">${device.name}</div>
                <div class="tile-state">${stateText}</div>
              </div>
            `;

            tile.onclick = () => {
              device.on = !device.on;
              renderContent();
            };

            gridContainer.appendChild(tile);
          });
        }

        renderContent();
      }
    });

    /* ===================================================
       APP 2: 1-FILE APP INSTALLER (Upload/Installeer Apps)
       =================================================== */
    TabOS.registerApp('installer', {
      title: 'App Installer',
      icon: '📦',
      width: '500px',
      height: '380px',
      render: function(container) {
        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:16px; height:100%;">
            <h3>Installeer 1-File App</h3>
            <p style="font-size:13px; color:var(--text-muted);">Sleep hier een HTML-bestand of plak de code van je app om hem direct toe te voegen aan TabOS.</p>
            
            <textarea id="appCodeInput" placeholder="Plak hier je HTML/JS app code..." style="width:100%; flex:1; background:rgba(0,0,0,0.3); color:#fff; border:1px solid var(--card-border); border-radius:8px; padding:10px; font-family:monospace; font-size:12px; resize:none;"></textarea>
            
            <div style="display:flex; gap:10px;">
              <input type="text" id="appNameInput" placeholder="App Naam" style="flex:1; background:rgba(0,0,0,0.3); color:#fff; border:1px solid var(--card-border); border-radius:8px; padding:8px 12px; font-size:13px;">
              <button id="installBtn" style="background:var(--accent-color); color:#0f172a; border:none; padding:8px 20px; border-radius:8px; font-weight:700; cursor:pointer;">Installeer</button>
            </div>
          </div>
        `;

        container.querySelector('#installBtn').onclick = () => {
          const code = container.querySelector('#appCodeInput').value;
          const name = container.querySelector('#appNameInput').value || 'Eigen App';
          
          if (!code) {
            alert('Voer eerst app-code in!');
            return;
          }

          const appId = 'custom_' + Date.now();
          
          // Registreer dynamisch als nieuwe TabOS app
          TabOS.registerApp(appId, {
            title: name,
            icon: '🧩',
            width: '500px',
            height: '400px',
            render: function(appContainer) {
              appContainer.innerHTML = code;
              // Voer eventuele script tags uit die in de code stonden
              const scripts = appContainer.querySelectorAll('script');
              scripts.forEach(s => {
                const newScript = document.createElement('script');
                newScript.textContent = s.textContent;
                document.body.appendChild(newScript);
              });
            }
          });

          alert(`App "${name}" is succesvol geïnstalleerd en toegevoegd aan je startmenu!`);
        };
      }
    });

  </script>
</body>
</html>
