<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TabOS - Kiosk Edition</title>
  
  <!-- PWA Fullscreen Kiosk Metadata -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22TabOS%22,%22short_name%22:%22TabOS%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23090d16%22,%22theme_color%22:%22%23090d16%22}">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --taskbar-bg: rgba(15, 23, 42, 0.95);
      --topbar-bg: rgba(15, 23, 42, 0.95);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --danger-color: #ef4444;
      --success-color: #22c55e;
      --window-header-bg: rgba(30, 41, 59, 0.95);
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-family);
      background: #090d16;
      color: var(--text-color);
      position: fixed;
      top: 0;
      left: 0;
    }

    /* 1. Bovenbalk van TabOS */
    #topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: var(--topbar-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 500;
      z-index: 99999;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--accent-color);
      font-weight: 700;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Desktop Area (Tussen bovenbalk en onderbalk) */
    #desktop {
      position: absolute;
      top: 36px;
      left: 0;
      right: 0;
      bottom: 54px;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      overflow: hidden;
    }

    /* Desktop App Grid */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 20px;
      padding: 24px;
      max-width: 700px;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
    }

    .desktop-icon:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.1);
    }

    .desktop-icon .icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .desktop-icon .label {
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      color: var(--text-color);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Window Styles */
    .window {
      position: absolute;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 300px;
      min-height: 380px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .window.minimized {
      opacity: 0;
      transform: scale(0.8) translateY(100px);
      pointer-events: none;
    }

    .window.maximized {
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 0;
    }

    .window-header {
      height: 44px;
      background: var(--window-header-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--card-border);
      cursor: move;
      touch-action: none;
    }

    .window-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .win-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .win-btn.close:active {
      background: var(--danger-color);
    }

    .window-body {
      flex: 1;
      overflow: auto;
      padding: 16px;
      position: relative;
      user-select: text;
      -webkit-user-select: text;
    }

    /* 2. Onderbalk (Taakbalk) van TabOS */
    #taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: var(--taskbar-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 99999;
    }

    .taskbar-left, .taskbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .taskbar-center {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }

    .start-btn {
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .taskbar-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .taskbar-item.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent-color);
    }

    .exit-kiosk-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Start Menu */
    #start-menu {
      position: absolute;
      bottom: 64px;
      left: 12px;
      width: 320px;
      background: rgba(30, 41, 59, 0.98);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
      z-index: 100000;
    }

    #start-menu.open {
      display: block;
    }

    .start-menu-header {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .start-menu-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .start-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .start-item:hover, .start-item:active {
      background: rgba(255, 255, 255, 0.08);
    }

    /* PIN Modal */
    #pin-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999999;
    }

    .pin-box {
      background: #1e293b;
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      width: 300px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .pin-box h3 {
      margin-bottom: 16px;
      font-size: 16px;
    }

    .pin-input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 24px;
      text-align: center;
      padding: 10px;
      margin-bottom: 16px;
      letter-spacing: 8px;
    }

    .pin-buttons {
      display: flex;
      gap: 10px;
    }

    .pin-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .pin-btn.cancel {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .pin-btn.submit {
      background: var(--accent-color);
      color: #0f172a;
    }

    /* Calculator */
    .calculator {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 12px;
    }

    .calc-screen {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      text-align: right;
      font-size: 28px;
      font-weight: 600;
      color: #fff;
      word-break: break-all;
      min-height: 70px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      flex: 1;
    }

    .calc-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-color);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
    }

    .calc-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .calc-btn.operator {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-color);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .calc-btn.equals {
      background: var(--accent-color);
      color: #0f172a;
    }
  </style>
</head>
<body>

  <!-- 1. BOVENBALK (Statusbalk) -->
  <div id="topbar">
    <div class="topbar-left">
      <span>🖥️ TabOS</span>
      <span style="font-size:11px; opacity:0.6; font-weight:normal;">| Lenovo Edition</span>
    </div>
    <div class="topbar-right">
      <span id="sys-wifi" title="Netwerk status">🌐 Online</span>
      <span id="sys-battery" title="Accu status">🔋 100%</span>
      <span id="sys-date" style="opacity:0.8;"></span>
      <span id="sys-clock" style="font-weight:700; color:var(--accent-color);">00:00</span>
    </div>
  </div>

  <!-- 2. DESKTOP WERKPLEK -->
  <div id="desktop">
    <div class="app-grid" id="desktop-grid"></div>
  </div>

  <!-- STARTMENU -->
  <div id="start-menu">
    <div class="start-menu-header">Applicaties</div>
    <div class="start-menu-list" id="start-list"></div>
  </div>

  <!-- PIN BEVEILIGING MODAL -->
  <div id="pin-modal">
    <div class="pin-box">
      <h3>Voer PIN in om Kiosk te verlaten</h3>
      <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••">
      <div class="pin-buttons">
        <button class="pin-btn cancel" id="pinCancel">Annuleer</button>
        <button class="pin-btn submit" id="pinSubmit">Ontgrendel</button>
      </div>
    </div>
  </div>

  <!-- 3. ONDERBALK (Taakbalk) -->
  <div id="taskbar">
    <div class="taskbar-left">
      <button class="start-btn" id="start-btn">
        <span>⚡</span> Start
      </button>
    </div>

    <div class="taskbar-center" id="taskbar-apps"></div>

    <div class="taskbar-right">
      <button class="exit-kiosk-btn" id="exit-kiosk-btn" title="Sluit Kiosk / Volledig Beeld">
        🔒 Kiosk Sluiten
      </button>
    </div>
  </div>

  <script>
    /* ===================================================
       TABOS CORE ENGINE
       =================================================== */
    const TabOS = {
      apps: {},
      windows: {},
      activeZIndex: 100,

      registerApp(id, config) {
        this.apps[id] = config;
        this.renderDesktopIcons();
        this.renderStartMenuItems();
      },

      openApp(id) {
        if (this.windows[id]) {
          this.focusWindow(id);
          this.windows[id].element.classList.remove('minimized');
          return;
        }

        const app = this.apps[id];
        if (!app) return;

        const winEl = document.createElement('div');
        winEl.className = 'window';
        winEl.style.width = app.width || '360px';
        winEl.style.height = app.height || '460px';
        
        const top = Math.max(10, (window.innerHeight - 90 - parseInt(winEl.style.height)) / 2);
        const left = Math.max(10, (window.innerWidth - parseInt(winEl.style.width)) / 2);
        winEl.style.top = top + 'px';
        winEl.style.left = left + 'px';

        winEl.innerHTML = `
          <div class="window-header">
            <div class="window-title">
              <span>${app.icon}</span>
              <span>${app.title}</span>
            </div>
            <div class="window-controls">
              <button class="win-btn min">—</button>
              <button class="win-btn max">□</button>
              <button class="win-btn close">✕</button>
            </div>
          </div>
          <div class="window-body"></div>
        `;

        document.getElementById('desktop').appendChild(winEl);

        const winData = { id: id, element: winEl, isMaximized: false };
        this.windows[id] = winData;

        const bodyEl = winEl.querySelector('.window-body');
        if (typeof app.render === 'function') {
          app.render(bodyEl);
        }

        this.setupWindowEvents(winData);
        this.focusWindow(id);
        this.updateTaskbar();
        document.getElementById('start-menu').classList.remove('open');
      },

      focusWindow(id) {
        const win = this.windows[id];
        if (!win) return;
        this.activeZIndex++;
        win.element.style.zIndex = this.activeZIndex;
        this.updateTaskbar();
      },

      closeWindow(id) {
        const win = this.windows[id];
        if (!win) return;
        win.element.remove();
        delete this.windows[id];
        this.updateTaskbar();
      },

      toggleMinimize(id) {
        const win = this.windows[id];
        if (!win) return;
        win.element.classList.toggle('minimized');
      },

      toggleMaximize(id) {
        const win = this.windows[id];
        if (!win) return;
        win.isMaximized = !win.isMaximized;
        win.element.classList.toggle('maximized', win.isMaximized);
      },

      setupWindowEvents(winData) {
        const el = winData.element;
        const header = el.querySelector('.window-header');

        el.addEventListener('pointerdown', () => this.focusWindow(winData.id));

        header.querySelector('.min').onclick = (e) => { e.stopPropagation(); this.toggleMinimize(winData.id); };
        header.querySelector('.max').onclick = (e) => { e.stopPropagation(); this.toggleMaximize(winData.id); };
        header.querySelector('.close').onclick = (e) => { e.stopPropagation(); this.closeWindow(winData.id); };

        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        const onPointerDown = (e) => {
          if (winData.isMaximized) return;
          isDragging = true;
          startX = e.clientX || e.touches?.[0].clientX;
          startY = e.clientY || e.touches?.[0].clientY;
          initialLeft = el.offsetLeft;
          initialTop = el.offsetTop;
          
          document.addEventListener('pointermove', onPointerMove);
          document.addEventListener('pointerup', onPointerUp);
        };

        const onPointerMove = (e) => {
          if (!isDragging) return;
          const currentX = e.clientX || e.touches?.[0].clientX;
          const currentY = e.clientY || e.touches?.[0].clientY;
          el.style.left = (initialLeft + (currentX - startX)) + 'px';
          el.style.top = (initialTop + (currentY - startY)) + 'px';
        };

        const onPointerUp = () => {
          isDragging = false;
          document.removeEventListener('pointermove', onPointerMove);
          document.removeEventListener('pointerup', onPointerUp);
        };

        header.addEventListener('pointerdown', onPointerDown);
      },

      renderDesktopIcons() {
        const grid = document.getElementById('desktop-grid');
        grid.innerHTML = '';
        Object.keys(this.apps).forEach(id => {
          const app = this.apps[id];
          const iconEl = document.createElement('div');
          iconEl.className = 'desktop-icon';
          iconEl.innerHTML = `<div class="icon">${app.icon}</div><div class="label">${app.title}</div>`;
          iconEl.onclick = () => this.openApp(id);
          grid.appendChild(iconEl);
        });
      },

      renderStartMenuItems() {
        const list = document.getElementById('start-list');
        list.innerHTML = '';
        Object.keys(this.apps).forEach(id => {
          const app = this.apps[id];
          const itemEl = document.createElement('div');
          itemEl.className = 'start-item';
          itemEl.innerHTML = `<span style="font-size: 20px;">${app.icon}</span><span>${app.title}</span>`;
          itemEl.onclick = () => this.openApp(id);
          list.appendChild(itemEl);
        });
      },

      updateTaskbar() {
        const container = document.getElementById('taskbar-apps');
        container.innerHTML = '';
        Object.keys(this.windows).forEach(id => {
          const win = this.windows[id];
          const app = this.apps[id];
          const item = document.createElement('div');
          item.className = 'taskbar-item' + (parseInt(win.element.style.zIndex) === this.activeZIndex ? ' active' : '');
          item.innerHTML = `<span>${app.icon}</span><span>${app.title}</span>`;
          item.onclick = () => {
            if (win.element.classList.contains('minimized')) {
              win.element.classList.remove('minimized');
              this.focusWindow(id);
            } else if (parseInt(win.element.style.zIndex) === this.activeZIndex) {
              this.toggleMinimize(id);
            } else {
              this.focusWindow(id);
            }
          };
          container.appendChild(item);
        });
      }
    };

    /* ===================================================
       SYSTEEMSTATUS & BOVENBALK LOGICA
       =================================================== */
    function updateClockAndDate() {
      const d = new Date();
      document.getElementById('sys-clock').innerText = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('sys-date').innerText = d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
    }
    setInterval(updateClockAndDate, 1000);
    updateClockAndDate();

    if ('getBattery' in navigator) {
      navigator.getBattery().then(battery => {
        const updateBat = () => {
          const level = Math.round(battery.level * 100);
          document.getElementById('sys-battery').innerText = `${battery.charging ? '⚡' : '🔋'} ${level}%`;
        };
        updateBat();
        battery.addEventListener('levelchange', updateBat);
        battery.addEventListener('chargingchange', updateBat);
      });
    }

    function updateOnlineStatus() {
      document.getElementById('sys-wifi').innerText = navigator.onLine ? '🌐 Online' : '📡 Offline';
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    document.getElementById('start-btn').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('start-menu').classList.toggle('open');
    };
    document.addEventListener('click', () => {
      document.getElementById('start-menu').classList.remove('open');
    });

    /* ===================================================
       BEVEILIGDE KIOSK LOCKDOWN & PIN BEVEILIGING (PIN: 8)
       =================================================== */
    const pinModal = document.getElementById('pin-modal');
    const pinInput = document.getElementById('pinInput');
    const exitKioskBtn = document.getElementById('exit-kiosk-btn');
    let kioskActive = false;

    // Automatisch fullscreen starten bij 1e tik/interactie
    function enterKiosk() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          kioskActive = true;
        }).catch(() => {});
      }
    }

    document.body.addEventListener('click', enterKiosk, { once: true });
    document.body.addEventListener('touchstart', enterKiosk, { once: true });

    // Kiosk Sluiten knop vraagt om PIN
    exitKioskBtn.onclick = () => {
      pinModal.style.display = 'flex';
      pinInput.value = '';
      pinInput.focus();
    };

    // Als de gebruiker toch uit fullscreen swipet, herstellen we het tenzij ontgrendeld met PIN
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && kioskActive) {
        // Scherm is zonder PIN verlaten -> Toon meteen de PIN-box!
        pinModal.style.display = 'flex';
        pinInput.value = '';
        pinInput.focus();
      }
    });

    document.getElementById('pinSubmit').onclick = () => {
      if (pinInput.value === '8') {
        kioskActive = false; // PIN goedgekeurd
        pinModal.style.display = 'none';
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
      } else {
        alert('Onjuiste PIN!');
        pinInput.value = '';
      }
    };

    document.getElementById('pinCancel').onclick = () => {
      pinModal.style.display = 'none';
      // Als ze op annuleren klikken, weer terug naar fullscreen dwingen
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    };

    pinInput.onkeydown = (e) => {
      if (e.key === 'Enter') {
        document.getElementById('pinSubmit').click();
      }
    };

    /* ===================================================
       APP 1: CALCULATOR (Rekenmachine)
       =================================================== */
    TabOS.registerApp('calculator', {
      title: 'Rekenmachine',
      icon: '🧮',
      width: '320px',
      height: '420px',
      render: function(container) {
        container.innerHTML = `
          <div class="calculator">
            <div class="calc-screen" id="calcScreen">0</div>
            <div class="calc-buttons">
              <button class="calc-btn operator" data-action="clear">C</button>
              <button class="calc-btn operator" data-value="(">(</button>
              <button class="calc-btn operator" data-value=")">)</button>
              <button class="calc-btn operator" data-value="/">÷</button>
              
              <button class="calc-btn" data-value="7">7</button>
              <button class="calc-btn" data-value="8">8</button>
              <button class="calc-btn" data-value="9">9</button>
              <button class="calc-btn operator" data-value="*">×</button>
              
              <button class="calc-btn" data-value="4">4</button>
              <button class="calc-btn" data-value="5">5</button>
              <button class="calc-btn" data-value="6">6</button>
              <button class="calc-btn operator" data-value="-">-</button>
              
              <button class="calc-btn" data-value="1">1</button>
              <button class="calc-btn" data-value="2">2</button>
              <button class="calc-btn" data-value="3">3</button>
              <button class="calc-btn operator" data-value="+">+</button>
              
              <button class="calc-btn" data-value="0">0</button>
              <button class="calc-btn" data-value=".">.</button>
              <button class="calc-btn operator" data-action="back">⌫</button>
              <button class="calc-btn equals" data-action="equals">=</button>
            </div>
          </div>
        `;

        const screen = container.querySelector('#calcScreen');
        let currentInput = '0';

        container.querySelectorAll('.calc-btn').forEach(btn => {
          btn.onclick = () => {
            const val = btn.getAttribute('data-value');
            const action = btn.getAttribute('data-action');

            if (action === 'clear') {
              currentInput = '0';
            } else if (action === 'back') {
              currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
            } else if (action === 'equals') {
              try {
                currentInput = String(Function('"use strict";return (' + currentInput.replace(/×/g, '*').replace(/÷/g, '/') + ')')());
              } catch {
                currentInput = 'Fout';
              }
            } else if (val !== null) {
              if (currentInput === '0' || currentInput === 'Fout') {
                currentInput = val;
              } else {
                currentInput += val;
              }
            }

            screen.innerText = currentInput;
          };
        });
      }
    });

    /* ===================================================
       APP 2: 1-FILE APP INSTALLER
       =================================================== */
    TabOS.registerApp('installer', {
      title: 'App Installer',
      icon: '📦',
      width: '500px',
      height: '380px',
      render: function(container) {
        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:16px; height:100%;">
            <h3>Installeer 1-File App</h3>
            <p style="font-size:13px; color:var(--text-muted);">Plak de code van je app om hem direct toe te voegen aan TabOS.</p>
            
            <textarea id="appCodeInput" placeholder="Plak hier je HTML/JS app code..." style="width:100%; flex:1; background:rgba(0,0,0,0.3); color:#fff; border:1px solid var(--card-border); border-radius:8px; padding:10px; font-family:monospace; font-size:12px; resize:none;"></textarea>
            
            <div style="display:flex; gap:10px;">
              <input type="text" id="appNameInput" placeholder="App Naam" style="flex:1; background:rgba(0,0,0,0.3); color:#fff; border:1px solid var(--card-border); border-radius:8px; padding:8px 12px; font-size:13px;">
              <button id="installBtn" style="background:var(--accent-color); color:#0f172a; border:none; padding:8px 20px; border-radius:8px; font-weight:700; cursor:pointer;">Installeer</button>
            </div>
          </div>
        `;

        container.querySelector('#installBtn').onclick = () => {
          const code = container.querySelector('#appCodeInput').value;
          const name = container.querySelector('#appNameInput').value || 'Eigen App';
          
          if (!code) {
            alert('Voer eerst app-code in!');
            return;
          }

          const appId = 'custom_' + Date.now();
          
          TabOS.registerApp(appId, {
            title: name,
            icon: '🧩',
            width: '500px',
            height: '400px',
            render: function(appContainer) {
              appContainer.innerHTML = code;
              const scripts = appContainer.querySelectorAll('script');
              scripts.forEach(s => {
                const newScript = document.createElement('script');
                newScript.textContent = s.textContent;
                document.body.appendChild(newScript);
              });
            }
          });

          alert(`App "${name}" is succesvol geïnstalleerd!`);
        };
      }
    });

  </script>
</body>
</html>
