<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TabOS - Sheets Viewer Edition</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --taskbar-bg: rgba(15, 23, 42, 0.95);
      --topbar-bg: rgba(15, 23, 42, 0.95);
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --danger-color: #ef4444;
      --success-color: #22c55e;
      --window-header-bg: rgba(30, 41, 59, 0.95);
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; font-family: var(--font-family); background: #090d16; color: var(--text-color); position: fixed; top: 0; left: 0; overscroll-behavior: none; }

    #topbar { position: absolute; top: 0; left: 0; right: 0; height: 36px; background: var(--topbar-bg); border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 13px; font-weight: 500; z-index: 99999; }
    .topbar-left { display: flex; align-items: center; gap: 12px; color: var(--accent-color); font-weight: 700; }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .update-btn { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: var(--accent-color); padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }

    #desktop { position: absolute; top: 36px; left: 0; right: 0; bottom: 54px; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); overflow: hidden; }
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 20px; padding: 24px; max-width: 700px; }
    .desktop-icon { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 12px; border-radius: 16px; cursor: pointer; background: rgba(255, 255, 255, 0.03); }
    .desktop-icon:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.1); }
    .desktop-icon .icon { font-size: 44px; margin-bottom: 8px; }
    .desktop-icon .label { font-size: 13px; font-weight: 500; text-align: center; color: var(--text-color); }

    .window { position: absolute; background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; min-width: 360px; min-height: 440px; }
    .window.minimized { opacity: 0; transform: scale(0.8) translateY(100px); pointer-events: none; }
    .window.maximized { top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; }
    .window-header { height: 48px; background: var(--window-header-bg); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--card-border); cursor: move; touch-action: none; }
    .window-title { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
    .window-controls { display: flex; gap: 10px; }
    .win-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(255, 255, 255, 0.1); color: var(--text-color); display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }
    .win-btn.close:active { background: var(--danger-color); }
    .window-body { flex: 1; overflow: hidden; position: pointer; display: flex; flex-direction: column; }

    #taskbar { position: absolute; bottom: 0; left: 0; right: 0; height: 54px; background: var(--taskbar-bg); border-top: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 99999; }
    .taskbar-left, .taskbar-right { display: flex; align-items: center; gap: 8px; }
    .taskbar-center { display: flex; align-items: center; gap: 6px; overflow-x: auto; }
    .start-btn { background: var(--accent-color); color: #0f172a; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .taskbar-item { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .taskbar-item.active { background: rgba(255, 255, 255, 0.15); border-color: var(--accent-color); }
    .exit-kiosk-btn { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }

    #start-menu { position: absolute; bottom: 64px; left: 12px; width: 300px; background: rgba(30, 41, 59, 0.98); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; display: none; z-index: 100000; }
    #start-menu.open { display: block; }
    .start-menu-header { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
    .start-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }

    #pin-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 999999; }
    .pin-box { background: #1e293b; border: 1px solid var(--card-border); padding: 24px; border-radius: 16px; text-align: center; width: 300px; }
    .pin-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size: 24px; text-align: center; padding: 12px; margin-bottom: 16px; }
    .pin-buttons { display: flex; gap: 10px; }
    .pin-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
    .pin-btn.cancel { background: rgba(255,255,255,0.1); color: #fff; }
    .pin-btn.submit { background: var(--accent-color); color: #0f172a; }
  </style>
</head>
<body>

  <div id="topbar">
    <div class="topbar-left">
      <span>🖥️ TabOS</span>
      <span style="font-size:11px; opacity:0.6;">| Lenovo Tablet</span>
    </div>
    <div class="topbar-right">
      <button class="update-btn" id="sys-refresh">🔄 Update OS</button>
      <span id="sys-wifi">🌐 Online</span>
      <span id="sys-battery">🔋 100%</span>
      <span id="sys-clock" style="font-weight:700; color:var(--accent-color);">00:00</span>
    </div>
  </div>

  <div id="desktop">
    <div class="app-grid" id="desktop-grid"></div>
  </div>

  <div id="start-menu">
    <div class="start-menu-header">Applicaties</div>
    <div class="start-menu-list" id="start-list"></div>
  </div>

  <div id="pin-modal">
    <div class="pin-box">
      <h3>Voer PIN in (8)</h3>
      <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••">
      <div class="pin-buttons">
        <button class="pin-btn cancel" id="pinCancel">Annuleer</button>
        <button class="pin-btn submit" id="pinSubmit">Ontgrendel</button>
      </div>
    </div>
  </div>

  <div id="taskbar">
    <div class="taskbar-left">
      <button class="start-btn" id="start-btn">⚡ Start</button>
    </div>
    <div class="taskbar-center" id="taskbar-apps"></div>
    <div class="taskbar-right">
      <button class="exit-kiosk-btn" id="exit-kiosk-btn">🔒 Kiosk Sluiten</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    document.getElementById('sys-refresh').onclick = () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
      }
      window.location.reload(true);
    };

    const TabOS = {
      apps: {}, windows: {}, activeZIndex: 100,
      registerApp(id, config) { this.apps[id] = config; this.renderDesktopIcons(); this.renderStartMenuItems(); },
      openApp(id) {
        if (this.windows[id]) { this.focusWindow(id); this.windows[id].element.classList.remove('minimized'); return; }
        const app = this.apps[id]; if (!app) return;
        const winEl = document.createElement('div');
        winEl.className = 'window';
        winEl.style.width = app.width || '800px'; winEl.style.height = app.height || '550px';
        winEl.style.top = Math.max(10, (window.innerHeight - 90 - parseInt(winEl.style.height)) / 2) + 'px';
        winEl.style.left = Math.max(10, (window.innerWidth - parseInt(winEl.style.width)) / 2) + 'px';
        winEl.innerHTML = `<div class="window-header"><div class="window-title"><span>${app.icon}</span><span>${app.title}</span></div><div class="window-controls"><button class="win-btn min">—</button><button class="win-btn max">□</button><button class="win-btn close">✕</button></div></div><div class="window-body"></div>`;
        document.getElementById('desktop').appendChild(winEl);
        const winData = { id: id, element: winEl };
        this.windows[id] = winData;
        app.render(winEl.querySelector('.window-body'));
        this.setupWindowEvents(winData);
        this.focusWindow(id); this.updateTaskbar();
        document.getElementById('start-menu').classList.remove('open');
      },
      focusWindow(id) { const win = this.windows[id]; if (!win) return; this.activeZIndex++; win.element.style.zIndex = this.activeZIndex; this.updateTaskbar(); },
      closeWindow(id) { if (this.windows[id]) { this.windows[id].element.remove(); delete this.windows[id]; this.updateTaskbar(); } },
      toggleMinimize(id) { if (this.windows[id]) this.windows[id].element.classList.toggle('minimized'); },
      toggleMaximize(id) { if (this.windows[id]) this.windows[id].element.classList.toggle('maximized'); },
      setupWindowEvents(winData) {
        const el = winData.element; const header = el.querySelector('.window-header');
        el.addEventListener('pointerdown', () => this.focusWindow(winData.id));
        header.querySelector('.min').onclick = (e) => { e.stopPropagation(); this.toggleMinimize(winData.id); };
        header.querySelector('.max').onclick = (e) => { e.stopPropagation(); this.toggleMaximize(winData.id); };
        header.querySelector('.close').onclick = (e) => { e.stopPropagation(); this.closeWindow(winData.id); };
      },
      renderDesktopIcons() {
        const grid = document.getElementById('desktop-grid'); grid.innerHTML = '';
        Object.keys(this.apps).forEach(id => {
          const app = this.apps[id]; const iconEl = document.createElement('div'); iconEl.className = 'desktop-icon';
          iconEl.innerHTML = `<div class="icon">${app.icon}</div><div class="label">${app.title}</div>`;
          iconEl.onclick = () => this.openApp(id); grid.appendChild(iconEl);
        });
      },
      renderStartMenuItems() {
        const list = document.getElementById('start-list'); list.innerHTML = '';
        Object.keys(this.apps).forEach(id => {
          const app = this.apps[id]; const itemEl = document.createElement('div'); itemEl.className = 'start-item';
          itemEl.innerHTML = `<span style="font-size:20px;">${app.icon}</span><span>${app.title}</span>`;
          itemEl.onclick = () => this.openApp(id); list.appendChild(itemEl);
        });
      },
      updateTaskbar() {
        const container = document.getElementById('taskbar-apps'); container.innerHTML = '';
        Object.keys(this.windows).forEach(id => {
          const win = this.windows[id]; const app = this.apps[id]; const item = document.createElement('div');
          item.className = 'taskbar-item' + (parseInt(win.element.style.zIndex) === this.activeZIndex ? ' active' : '');
          item.innerHTML = `<span>${app.icon}</span><span>${app.title}</span>`;
          item.onclick = () => { if (win.element.classList.contains('minimized')) { win.element.classList.remove('minimized'); this.focusWindow(id); } else { this.toggleMinimize(id); } };
          container.appendChild(item);
        });
      }
    };

    function updateClock() { document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
    setInterval(updateClock, 1000); updateClock();

    document.getElementById('start-btn').onclick = (e) => { e.stopPropagation(); document.getElementById('start-menu').classList.toggle('open'); };
    document.addEventListener('click', () => document.getElementById('start-menu').classList.remove('open'));

    // Kiosk PIN = 8
    const pinModal = document.getElementById('pin-modal'); const pinInput = document.getElementById('pinInput');
    document.getElementById('exit-kiosk-btn').onclick = () => { pinModal.style.display = 'flex'; pinInput.value = ''; pinInput.focus(); };
    document.getElementById('pinSubmit').onclick = () => {
      if (pinInput.value === '8') { pinModal.style.display = 'none'; if (document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
      else { alert('Onjuiste PIN!'); pinInput.value = ''; }
    };
    document.getElementById('pinCancel').onclick = () => pinModal.style.display = 'none';

    /* ===================================================
       APP: VOCHT TRACKER (DIRECTE GOOGLE SHEET VIEWER)
       =================================================== */
    TabOS.registerApp('vochttracker', {
      title: 'Vocht Tracker', icon: '💧', width: '820px', height: '560px',
      render: function(container) {
        // Vult hieronder je volledige Google Spreadsheet link in tussen de aanhalingstekens:
        const sheetUrl = "https://docs.google.com/spreadsheets/d/1JQiGWYuZVI9bRqleBxgffSjGCYBp3SnSAyrav0Y2WIc/edit?gid=2140100543#gid=2140100543";

        container.innerHTML = `
          <div style="width:100%; height:100%; display:flex; flex-direction:column;">
            <iframe src="${sheetUrl}" style="width:100%; height:100%; border:none; background:#fff;" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
          </div>
        `;
      }
    });

    // App 2: Rekenmachine
    TabOS.registerApp('calculator', {
      title: 'Rekenmachine', icon: '🧮', width: '340px', height: '460px',
      render: function(container) {
        container.innerHTML = `<div style="text-align:center; padding:20px;"><h3>Rekenmachine</h3></div>`;
      }
    });
  </script>
</body>
</html>
